name: Publish

# A release is a tag `vX.Y.Z` on a commit that is on main and whose
# `__version__` is X.Y.Z. Anything else is refused before it is built, and
# nothing is uploaded until CI has passed again on the tagged commit.
# `workflow_dispatch` runs the build and its checks only, as a dry run.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Commits reach main through pull requests that passed CI, but the ruleset
  # lets an admin push past it, and being on main is all the build job checks.
  ci:
    name: CI
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 — https://github.com/astral-sh/setup-uv/releases/tag/v10.3.2

      - name: Check the tag names the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pg_debug/__init__.py)"
          test -n "$version" || { echo "could not read __version__"; exit 1; }
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag is $GITHUB_REF_NAME but __version__ is $version" >&2
            exit 1
          fi

      - name: Check the tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags --depth=200 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main; release from main only" >&2
            exit 1
          fi

      - name: Check the changelog has a section for this version
        if: github.ref_type == 'tag'
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\] - " CHANGELOG.md

      - name: Build distributions
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel into a clean environment and run it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/pg-debug --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: [ci, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pg-debug/
    permissions:
      # PyPI trusted publishing; no API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 — https://github.com/pypa/gh-action-pypi-publish/releases/tag/v1.14.3

  release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — https://github.com/actions/download-artifact/releases/tag/v8.0.2
        with:
          name: dist
          path: dist/

      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { printing = ($0 ~ "^## \\[" v "\\] - ") ; next }
            printing { print }
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          test -s notes.md || { echo "no changelog section for $version" >&2; exit 1; }
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "pg-debug ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
