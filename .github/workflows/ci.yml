name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-extras --locked

      - name: Verify Docker is running
        run: docker info

      - name: Test
        run: uv run pytest -v --log-cli-level=INFO

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.3.0

      - name: Build distributions
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel into a clean environment and run it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/pg-debug --version
          /tmp/smoke/bin/python -m pg_debug --version
          /tmp/smoke/bin/python -c "import pg_debug; print(pg_debug.__version__)"

  # The one check the main ruleset requires. It passes only when every job
  # above succeeded, so a new job or matrix entry is gated without editing the
  # ruleset, which has to be re-imported by hand.
  result:
    name: CI result
    needs: [lint, test, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
