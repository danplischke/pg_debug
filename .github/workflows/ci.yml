name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # publish.yml runs the whole of CI again on the tagged commit before it uploads.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # macOS runners have no Docker, so the container-backed tests skip
          # there and everything else runs.
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-extras --locked

      # The container-backed tests skip when Docker is missing, which on Linux
      # would only hide them; fail instead.
      - name: Verify Docker is running
        if: runner.os == 'Linux'
        run: docker info

      - name: Test
        run: uv run pytest -v --log-cli-level=INFO

  # Every direct dependency at the lowest version pyproject.toml allows, so a
  # floor that has stopped being true fails here rather than in someone's
  # environment; the lockfile only ever moves up. uv resolves the extras
  # together and the llm extra's instructor needs pydantic 2.8, so pydantic
  # runs at 2.8 here, not at its own floor.
  lowest:
    name: lowest dependencies (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install the lowest allowed versions
        run: uv sync --all-extras --resolution lowest-direct

      - name: Show the installed versions
        run: uv pip list

      - name: Unit tests
        run: uv run --no-sync pytest tests/unit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0 — https://github.com/astral-sh/setup-uv/releases/tag/v10.3.0

      - name: Build distributions
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel into a clean environment and run it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/pg-debug --version
          /tmp/smoke/bin/python -m pg_debug --version
          /tmp/smoke/bin/python -c "import pg_debug; print(pg_debug.__version__)"

  # The one check the main ruleset requires. It passes only when every job
  # above succeeded, so a new job or matrix entry is gated without editing the
  # ruleset, which has to be re-imported by hand.
  result:
    name: CI result
    needs: [lint, test, lowest, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
