[project]
name = "pg-debug"
dynamic = ["version"]
description = "PostgreSQL inspection, health and index tuning as a Python library with a CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.2",
    "humanize>=4.15.0",
    "pglast==7.20",
    "psycopg-pool>=3.3.0",
]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Dan Plischke" }]
keywords = ["postgres", "postgresql", "database", "index", "tuning", "explain", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/danplischke/pg_debug"
Repository = "https://github.com/danplischke/pg_debug"
Changelog = "https://github.com/danplischke/pg_debug/blob/main/CHANGELOG.md"
Issues = "https://github.com/danplischke/pg_debug/issues"

[project.optional-dependencies]
llm = ["instructor>=1.14.4", "pydantic>=2.0"]

[project.scripts]
pg-debug = "pg_debug.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pg_debug/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_debug"]

[tool.pytest.ini_options]
pythonpath = ["./src", "./tests"]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "docker>=7.1.0",
    "pre-commit>=4.6.2",
    "pyright==1.1.408",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.0.0",
    "ruff==0.14.13",
]

[tool.ruff]
line-length = 150
target-version = "py312"
exclude = [".venv*"]

lint.select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "G004",  # logging-f-string: pass arguments, so a message is formatted only if it is emitted
    "RUF"  # ruff-specific rules
]

lint.ignore = [
    "RUF059", # Unused unpacked variable
    "RUF100", # Unused noqa directive
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["pg_debug"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportPrivateUsage = true
reportUntypedFunctionDecorator = true
reportMissingTypeArgument = true
reportInvalidTypeVarUse = true
reportUnnecessaryCast = true

# Tests legitimately reach into internals to exercise them directly.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
